<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集和品牌咨询 · 专区预览</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#F5F5F7;color:#1D1D1F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.04)}
.card h1{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.card .sub{font-size:.85rem;color:#86868B;margin-bottom:32px}
.links{display:flex;flex-direction:column;gap:12px}
.links a{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:14px;text-decoration:none;font-weight:700;font-size:.95rem;transition:all .2s}
.links a.group{background:#B01E23;color:#fff}
.links a.group:hover{filter:brightness(1.1)}
.links a.health{background:#fff;color:#1D1D1F;border:2px solid #E8E8ED}
.links a.health:hover{border-color:#B01E23}
.links a .arrow{font-size:1.1rem}
.footer{font-size:.72rem;color:#86868B;margin-top:28px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h1>集和品牌咨询</h1>
<p class="sub">官网专区预览</p>
<div class="links">
<a href="/bico-pages/group.html" class="group">
<span>上市集团企业品牌升级</span>
<span class="arrow">→</span>
</a>
<a href="/bico-pages/health.html" class="health">
<span>大健康品牌升级</span>
<span class="arrow">→</span>
</a>
</div>
<p class="footer">集和品牌咨询 · 品牌升级，先建结构</p>
</div>
</body>
</html>
